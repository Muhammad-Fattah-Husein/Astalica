<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" width="400" height="550">
  <defs>
    <style>
      .bg { fill: #FFFFFF; }
      .header-bg { fill: #EE2E24; }
      .text-title { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #1B3B2B; text-anchor: middle; letter-spacing: 1px; }
      .text-sub { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 10px; fill: #666666; text-anchor: middle; }
      .text-qris { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 24px; font-weight: 900; fill: #FFFFFF; letter-spacing: 2px; }
      .text-sub-qris { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 8px; font-weight: 600; fill: #FFFFFF; letter-spacing: 1.5px; }
      .text-footer { font-family: 'Helvetica Neue', Arial, sans-serif; font-size: 9px; fill: #888888; text-anchor: middle; }
    </style>
  </defs>

  <!-- Card Background with Shadow Border -->
  <rect x="2" y="2" width="396" height="546" rx="20" fill="#FFFFFF" stroke="#E8DEC8" stroke-width="3" />
  
  <!-- Header QRIS Red Banner -->
  <path d="M 2 22 Q 2 2 22 2 L 378 2 Q 398 2 398 22 L 398 75 L 2 75 Z" fill="#D32F2F" />
  <text x="200" y="42" class="text-qris" text-anchor="middle">QRIS</text>
  <text x="200" y="58" class="text-sub-qris" text-anchor="middle">QR KODE STANDAR PEMBAYARAN NASIONAL</text>

  <!-- Merchant Info -->
  <text x="200" y="105" class="text-title">ASTALICA HAUTE MODESTY</text>
  <text x="200" y="122" class="text-sub">NMID : ID1026092026888 • A.N. ATELIER ASTALICA</text>

  <!-- QR Code Frame -->
  <rect x="50" y="140" width="300" height="300" rx="12" fill="#FDFBF7" stroke="#C5A059" stroke-width="2" />
  
  <!-- QR Matrix Finder Pattern 1 (Top-Left) -->
  <rect x="70" y="160" width="60" height="60" rx="6" fill="#1B3B2B" />
  <rect x="78" y="168" width="44" height="44" rx="3" fill="#FFFFFF" />
  <rect x="86" y="176" width="28" height="28" rx="2" fill="#1B3B2B" />

  <!-- QR Matrix Finder Pattern 2 (Top-Right) -->
  <rect x="270" y="160" width="60" height="60" rx="6" fill="#1B3B2B" />
  <rect x="278" y="168" width="44" height="44" rx="3" fill="#FFFFFF" />
  <rect x="286" y="176" width="28" height="28" rx="2" fill="#1B3B2B" />

  <!-- QR Matrix Finder Pattern 3 (Bottom-Left) -->
  <rect x="70" y="360" width="60" height="60" rx="6" fill="#1B3B2B" />
  <rect x="78" y="368" width="44" height="44" rx="3" fill="#FFFFFF" />
  <rect x="86" y="376" width="28" height="28" rx="2" fill="#1B3B2B" />

  <!-- Timing Patterns -->
  <line x1="140" y1="190" x2="260" y2="190" stroke="#1B3B2B" stroke-width="6" stroke-dasharray="10,10" />
  <line x1="100" y1="230" x2="100" y2="350" stroke="#1B3B2B" stroke-width="6" stroke-dasharray="10,10" />

  <!-- QR Simulated Data Blocks -->
  <g fill="#1B3B2B">
    <!-- Block clusters -->
    <rect x="145" y="160" width="16" height="16" />
    <rect x="175" y="160" width="24" height="12" />
    <rect x="215" y="160" width="16" height="24" />
    <rect x="245" y="165" width="12" height="12" />

    <rect x="145" y="210" width="12" height="20" />
    <rect x="165" y="215" width="20" height="14" />
    <rect x="200" y="205" width="28" height="16" />
    <rect x="240" y="210" width="16" height="20" />
    <rect x="270" y="235" width="22" height="14" />
    <rect x="305" y="230" width="18" height="20" />

    <rect x="70" y="235" width="18" height="16" />
    <rect x="70" y="270" width="14" height="20" />
    <rect x="70" y="310" width="20" height="18" />

    <rect x="120" y="245" width="16" height="28" />
    <rect x="150" y="250" width="24" height="16" />
    <rect x="220" y="245" width="20" height="24" />
    <rect x="250" y="255" width="28" height="16" />

    <rect x="120" y="290" width="22" height="18" />
    <rect x="155" y="285" width="16" height="28" />
    <rect x="225" y="295" width="24" height="18" />
    <rect x="260" y="285" width="18" height="24" />

    <rect x="145" y="330" width="24" height="16" />
    <rect x="180" y="335" width="16" height="20" />
    <rect x="210" y="325" width="20" height="26" />
    <rect x="245" y="330" width="24" height="14" />
    <rect x="280" y="320" width="16" height="24" />
    <rect x="310" y="330" width="16" height="16" />

    <rect x="145" y="365" width="18" height="22" />
    <rect x="175" y="375" width="24" height="16" />
    <rect x="215" y="365" width="16" height="24" />
    <rect x="245" y="370" width="20" height="18" />
    <rect x="280" y="365" width="22" height="20" />
    <rect x="310" y="375" width="16" height="16" />

    <rect x="145" y="400" width="24" height="16" />
    <rect x="180" y="395" width="18" height="22" />
    <rect x="210" y="400" width="26" height="14" />
    <rect x="250" y="395" width="20" height="20" />
    <rect x="285" y="400" width="18" height="16" />
  </g>

  <!-- Center Monogram Badge -->
  <circle cx="200" cy="290" r="24" fill="#FFFFFF" stroke="#C5A059" stroke-width="2.5" />
  <circle cx="200" cy="290" r="20" fill="#1B3B2B" />
  <text x="200" y="296" font-family="'Playfair Display', serif" font-size="16" font-weight="bold" fill="#C5A059" text-anchor="middle">A</text>

  <!-- Accepted Wallets & Banking Footer -->
  <text x="200" y="465" class="text-footer" font-weight="bold">MENERIMA PEMBAYARAN SEMUA BANK &amp; DOMPET ELEKTRONIK</text>
  <text x="200" y="482" class="text-footer">BCA • Mandiri • BRI • BNI • GoPay • OVO • Dana • ShopeePay</text>

  <g transform="translate(150, 498)">
    <rect x="0" y="0" width="100" height="26" rx="6" fill="#1B3B2B" />
    <text x="50" y="17" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#FDFBF7" text-anchor="middle" letter-spacing="1.5px">GPN / ASPI</text>
  </g>

  <text x="200" y="538" font-family="Arial, sans-serif" font-size="8" fill="#AAAAAA" text-anchor="middle">Dicetak Resmi oleh Astalica Luxury Modest Atelier Indonesia</text>
</svg>
